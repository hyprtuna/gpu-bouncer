name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The branch ruleset requires a check named exactly "gate". Everything that
  # must hold before code reaches main runs here, in one job, so that a green
  # gate is a complete statement rather than a partial one.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # setup-go v6 and later pin GOTOOLCHAIN=local, which keeps the build
      # and the tests on the go.mod floor. staticcheck itself needs a newer
      # Go, so its install alone may fetch one.
      - name: staticcheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: build
        run: go build ./...

      # go-nvml binds through cgo. The binary must still build and degrade to
      # the sysfs source when cgo is unavailable, so that path is compiled too.
      - name: build without cgo
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: test
        run: go test -race ./...

      # The release job depends on this script; a tag whose CHANGELOG section
      # is missing must fail here, on the PR, not at publish time. The script
      # has its own tests, and the real CHANGELOG's top section must extract.
      - name: release notes script
        run: |
          .github/scripts/release-notes_test.sh
          top="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]*)?\]' CHANGELOG.md | sed -e 's/^## \[//' -e 's/\]$//')"
          .github/scripts/release-notes.sh "v$top" CHANGELOG.md >/dev/null

      - name: no em or en dashes
        run: |
          if git grep -nP '\x{2014}|\x{2013}' -- .; then
            echo "Em and en dashes are not used in this repository. Use a plain hyphen."
            exit 1
          fi
